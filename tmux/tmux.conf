# Mouse Support
set -g mouse on

# Terminal
set -g default-command elvish
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 10
set -g focus-events on
set -g detach-on-destroy off
set -g status-right "#(date +'%Y-%m-%dT%H:%M%z')"
set -g status-interval 5

# Mode Keys
set -g mode-keys vi

# Scrollback
set -g history-limit 1000000

# Move like in VIM windows
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload configuration file
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "reloaded tmux configuration"

# Scratch file
bind-key " " display-popup -E -w 80% -h 80% -b double -T "#{client_user}@#H" hx ~/scratch.md

# Windows
bind-key c new-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
